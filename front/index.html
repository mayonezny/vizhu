<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/assets/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ВИЖУ</title>

    <style>
      /* ─── App Preloader ──────────────────────────────────────────────────
         Shown while JS loads. React removes it on mount via main.tsx.
         Uses only CSS — no JS dependency, works even if bundle fails to load.
      ──────────────────────────────────────────────────────────────────── */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #1d4ed8;
      }

      #app-preloader {
        position: fixed;
        inset: 0;
        background: #1d4ed8;
        background-image: radial-gradient(ellipse 70% 60% at 30% 70%, #2563eb 0%, transparent 70%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition:
          opacity 0.35s ease,
          visibility 0.35s ease;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      #app-preloader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .pre-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        flex: 1;
        justify-content: center;
      }

      .pre-brand {
        display: flex;
        align-items: center;
      }

      .pre-brand-logo {
        color: #ffffff;
        width: 140px;
        height: auto;
      }

      .pre-subtitle {
        color: #ffffff;
        font-size: 20px;
        font-weight: 600;
        opacity: 0.9;
      }

      .pre-footer {
        padding-bottom: 32px;
        color: rgba(255, 255, 255, 0.45);
        font-size: 14px;
        letter-spacing: 0.04em;
      }

      #app-preloader::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: radial-gradient(ellipse 80% 55% at 70% 30%, #3b82f6 0%, transparent 65%);
        animation: pre-glow 4s ease-in-out infinite alternate;
        pointer-events: none;
        z-index: 0;
      }

      .pre-center,
      .pre-footer {
        position: relative;
        z-index: 1;
      }

      @keyframes pre-glow {
        0% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }
    </style>
  </head>
