version: "3.9"

services:

  nginx:
    volumes:
      - ./nginx/conf.d/dev.conf:/etc/nginx/conf.d/default.conf:ro

  front:
    build:
      target: development
    volumes:
      - ../front:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost/api
      VITE_WS_URL: ws://localhost/ws
    command: npm run dev -- --host 0.0.0.0 --port 5173

  landing:
    build:
      target: development
    volumes:
      - ../landing:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

  api:
    build:
      target: development
    volumes:
      - ../api:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://vizhu:devpassword@postgres:5432/vizhu
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai:8000
      JWT_SECRET: dev_secret_not_for_prod
    command: npm run start:dev

  ai:
    volumes:
      - ../ai:/app
    environment:
      RELOAD: "true"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  postgres:
    environment:
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"
