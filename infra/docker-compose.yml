version: "3.9"

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
  shared-web:
    external: true

volumes:
  postgres_data:
  redis_data:
  certbot_conf:
  certbot_www:

services:

  nginx:
    image: nginx:1.25-alpine
    container_name: vizhu_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - frontend_net
      - shared-web
    depends_on:
      - front
      - api

  front:
    image: ghcr.io/${GHCR_OWNER}/vizhu-front:latest
    build:
      context: ../front
      dockerfile: Dockerfile
      target: production
    container_name: vizhu_front
    restart: unless-stopped
    networks:
      - frontend_net
      - shared-web

  api:
    image: ghcr.io/${GHCR_OWNER}/vizhu-api:latest
    build:
      context: ../api
      dockerfile: Dockerfile
      target: production
    container_name: vizhu_api
    restart: unless-stopped
    networks:
      - frontend_net
      - backend_net
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://vizhu:${POSTGRES_PASSWORD}@postgres:5432/vizhu
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai:8000
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      SMSC_API_KEY: ${SMSC_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    #   redis:
    #     condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  ai:
    image: ghcr.io/${GHCR_OWNER}/vizhu-ai:latest
    build:
      context: ../ai
      dockerfile: Dockerfile
    container_name: vizhu_ai
    restart: unless-stopped
    networks:
      - backend_net
    environment:
      GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID}
      YANDEX_API_KEY: ${YANDEX_API_KEY}
      REDIS_URL: redis://redis:6379
    # depends_on:
    #   redis:
    #     condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: vizhu_postgres
    restart: unless-stopped
    networks:
      - backend_net
    environment:
      POSTGRES_DB: vizhu
      POSTGRES_USER: vizhu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vizhu -d vizhu"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    profiles:
      - max
    image: redis:7-alpine
    container_name: vizhu_redis
    restart: unless-stopped
    networks:
      - backend_net
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  certbot:
    image: certbot/certbot:latest
    container_name: vizhu_certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    profiles:
      - ssl
