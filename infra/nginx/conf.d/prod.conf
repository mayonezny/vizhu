# HTTP → HTTPS редирект
server {
    listen 80;
    server_name vizhu.su www.vizhu.su;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Основной HTTPS
server {
    listen 443 ssl http2;
    server_name vizhu.su www.vizhu.su;

    # Let's Encrypt (после init-ssl.sh)
    # ssl_certificate     /etc/letsencrypt/live/vizhu.su/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/vizhu.su/privkey.pem;

    # Если используешь сертификат от reg.ru — закомментируй выше и раскомментируй:
    ssl_certificate     /etc/nginx/ssl/vizhu.su.crt;
    ssl_certificate_key /etc/nginx/ssl/vizhu.su.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # front — React статика
    location / {
        proxy_pass         http://front:80;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # REST API
    location /api/ {
        proxy_pass         http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # WebSocket (история, уведомления)
    location /ws/ {
        proxy_pass         http://api:3000/ws/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;
    }

    # WebRTC сигналинг
    location /rtc/ {
        proxy_pass         http://api:3000/rtc/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;
    }
}
