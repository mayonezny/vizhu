# HTTP → HTTPS редирект
server {
    listen 80;
    server_name vizhu.su www.vizhu.su;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Основной HTTPS
server {
    listen 443 ssl http2;
    server_name vizhu.su www.vizhu.su;

    # Let's Encrypt (после init-ssl.sh)
    # ssl_certificate     /etc/letsencrypt/live/vizhu.su/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/vizhu.su/privkey.pem;

    # Если используешь сертификат от reg.ru — закомментируй выше и раскомментируй:
    ssl_certificate     /etc/nginx/ssl/vizhu.su-fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/certificate.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Лендинг vizhu.su (раньше был редирект на app.vizhu.su)
    location / {
        proxy_pass         http://landing:80;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
