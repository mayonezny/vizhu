name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/vizhu

jobs:

  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      front: ${{ steps.filter.outputs.front }}
      ai: ${{ steps.filter.outputs.ai }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
            front:
              - 'front/**'
            ai:
              - 'ai/**'
            infra:
              - 'infra/**'

  test-api:
    name: Test API (NestJS)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    defaults:
      run:
        working-directory: ./api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  test-front:
    name: Test front (React)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.front == 'true'
    defaults:
      run:
        working-directory: ./front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm run lint:fix && npm run format:fix
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test

  test-ai:
    name: Test AI (FastAPI)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.ai == 'true'
    defaults:
      run:
        working-directory: ./ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest
        env:
          GIGACHAT_CREDENTIALS: dummy
          YANDEX_FOLDER_ID: dummy
          YANDEX_API_KEY: dummy

  build-api:
    name: Build & Push API
    runs-on: ubuntu-latest
    needs: [detect-changes, test-api]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.detect-changes.outputs.api == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./api
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-front:
    name: Build & Push Front
    runs-on: ubuntu-latest
    needs: [detect-changes, test-front]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.detect-changes.outputs.front == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-front
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./front
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-ai:
    name: Build & Push AI
    runs-on: ubuntu-latest
    needs: [detect-changes, test-ai]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.detect-changes.outputs.ai == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ai
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./ai
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to vizhu.su
    runs-on: ubuntu-latest
    needs: [detect-changes, build-api, build-front, build-ai]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      (needs.build-api.result == 'success' || needs.build-front.result == 'success' || needs.build-ai.result == 'success' || needs.detect-changes.outputs.infra == 'true')
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1
        env:
          API_CHANGED: ${{ needs.detect-changes.outputs.api }}
          FRONT_CHANGED: ${{ needs.detect-changes.outputs.front }}
          AI_CHANGED: ${{ needs.detect-changes.outputs.ai }}
        with:
          host: ${{ secrets.SERVER_API_ADDR }}
          username: ${{ secrets.SERVER_HOST_USERNAME }}
          key: ${{ secrets.SERVER_SSH_IDENTITY_FILE }}
          envs: API_CHANGED,FRONT_CHANGED,AI_CHANGED
          script: |
            set -e
            cd ~/vizhu
            git pull origin main
            cd infra
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            if [ "$API_CHANGED" = "true" ]; then
              echo "==> Deploying api..."
              docker compose pull api
              docker compose up -d --no-deps api
            fi

            if [ "$FRONT_CHANGED" = "true" ]; then
              echo "==> Deploying front..."
              docker compose pull front
              docker compose up -d --no-deps front
            fi

            if [ "$AI_CHANGED" = "true" ]; then
              echo "==> Deploying ai..."
              docker compose pull ai
              docker compose up -d --no-deps ai
            fi

            docker image prune -f
            sleep 5
            docker compose ps
